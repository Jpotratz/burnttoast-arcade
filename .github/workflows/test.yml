# CI: compile everything and run the full JUnit suite on every push and PR.
# Green check = the engine still works; red X = something broke.

name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: ./gradlew test
