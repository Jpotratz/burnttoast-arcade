<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BurntToast Arcade</title>
  <link rel="stylesheet" href="/assets/theme.css">
  <style>
    main { max-width: 900px; margin: 0 auto; padding: 48px 24px; text-align: center; }
    header h1 { font-size: 52px; margin: 0; }
    header p { margin: 8px 0 40px; font-size: 17px; }
    #games { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
    a.game-card { display: block; text-decoration: none; color: var(--text); text-align: left;
                  transition: transform 120ms; }
    a.game-card:hover { transform: translateY(-4px); }
    a.game-card h2 { margin: 0 0 8px; font-size: 26px; }
    a.game-card p { margin: 0; color: var(--text-dim); font-size: 14px; line-height: 1.5; }
    a.game-card .play { display: inline-block; margin-top: 14px; font-weight: bold; }
    footer { margin-top: 56px; color: var(--text-dim); font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 class="neon-cyan">BURNTTOAST ARCADE</h1>
      <p class="neon-magenta">// insert coin :: choose your game</p>
    </header>
    <div id="games"></div>
    <footer>self-hosted on BurntToast &middot; scores are forever</footer>
  </main>
  <script>
    fetch('/api/games').then(r => r.json()).then(games => {
      document.getElementById('games').innerHTML = games.map(g => `
        <a class="game-card panel" href="${g.path}">
          <h2 class="neon-cyan">${g.title}</h2>
          <p>${g.description}</p>
          <span class="play neon-green">PLAY &#9654;</span>
        </a>`).join('');
    });
  </script>
</body>
</html>
